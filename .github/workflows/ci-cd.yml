name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/incidenthub-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/incidenthub-frontend
  VITE_API_URL: http://incidenthub.local/api 

jobs:
  # ==================== JOB 1: BUILD & TEST ====================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint || echo "No lint script found, skipping..."

      # Frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}  
        run: npm run build

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint || echo "No lint script found, skipping..."

  # ==================== JOB 2: BUILD DOCKER IMAGES ====================
  build-docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      # Build et push Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.date }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      # Build et push Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }} 
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.date }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Image digest
        run: |
          echo "Backend image: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}"
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}"

  # ==================== JOB 3: DEPLOY TO KUBERNETES ====================
  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deployment started"
          echo "📦 Backend image: ${{ env.BACKEND_IMAGE }}:latest"
          echo "📦 Frontend image: ${{ env.FRONTEND_IMAGE }}:latest"
          echo "🌐 API URL: ${{ env.VITE_API_URL }}"
          echo ""
          echo "⚠️  Note: Pour déployer automatiquement sur Minikube local,"
          echo "    vous devez configurer un runner self-hosted ou utiliser"
          echo "    un cluster Kubernetes accessible (GKE, EKS, AKS)."
          echo ""
          echo "📝 Pour le déploiement manuel sur Minikube :"
          echo "    kubectl rollout restart deployment/backend -n incidenthub"
          echo "    kubectl rollout restart deployment/frontend -n incidenthub"